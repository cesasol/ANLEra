#define AI_SIDE
    controller=ai
    allow_player=no
    disallow_observers=yes
    team_name=enemies
    user_team_name= _ "teamname^Enemies"
    fog=yes
    gold=25
    income=16
    village_gold=6
    controller_lock=yes
    faction_lock=yes
    leader_lock=yes
    team_lock=yes
    color_lock=yes
    gold_lock=no
    income_lock=no
    leader_lock=yes
    faction_lock=yes
    [modifications]
        {MOVEMENT_RESTRICTION}
    [/modifications]
    [ai]
        aggression=1.0
        recruitment_pattern=fighter
        [avoid]
            [filter]
                side=10
            [/filter]
            radius=1
        [/avoid]
        {MODIFY_AI_DELETE_CANDIDATE_ACTION 6 main_loop retreat_injured}
        {MODIFY_AI_DELETE_CANDIDATE_ACTION 6 main_loop castle_switch}
    [/ai]
#enddef

[side]
    {AI_SIDE}
    side=6
    recruit=Goblin Spearman
    type=Orcish Sovereign
    name= _ "Gol Goroth"
    [village]
        x,y=50,25
    [/village]
[/side]
[side]
