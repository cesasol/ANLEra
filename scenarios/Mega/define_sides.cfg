# This side is for trapped units. It is allied to the AI so they don't attack it.

[side]
    side=10
    color=teal
    controller=null
    allow_player=no
    disallow_observers=yes
    hidden=yes
    share_vision=none
    team_name=settlers,enemies
    user_team_name= _ "teamname^Prisoners"
    income=-2
    gold=0
    village_gold=0
    team_lock=yes
    color_lock=no
    gold_lock=yes
    income_lock=yes
    leader_lock=yes
    controller_lock=yes
    [ai]
        ai_algorithm=idle_ai
    [/ai]
[/side]

[side]
    side=11
    color=lightblue
    controller=ai
    allow_player=no
    disallow_observers=yes
    hidden=yes
    share_vision=none
    team_name=enemies # must be in same team on this map
    user_team_name= _ "teamname^Enemies"
    gold=0
    income=-2
    village_gold=0
    team_lock=yes
    color_lock=no
    gold_lock=yes
    income_lock=yes
    leader_lock=yes
    controller_lock=yes
    [ai]
        aggression=1.0
        village_value=0
        # avoiding the AI guards in case spider is lured out
        [avoid]
            x=26,34,26,34,45,47,47,45
            y=18,18,37,37,24,27,29,32
            [filter]
                side=6,7,8,9
                level=2
            [/filter]
            radius=1
        [/avoid]
    [/ai]
[/side]


#undef AI_SIDE
#undef PLAYER_SIDE